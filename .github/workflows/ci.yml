name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: swift test
      - run: python3 -B spam_reputation_reference_20261003.py
      - run: python3 -B scripts/test-release-validation.py
      - run: python3 -B scripts/validate-site.py
  ios:
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install verified XcodeGen 2.46.0
        env:
          XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/xcodegen.zip" https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          printf '%s  %s\n' "$XCODEGEN_SHA256" "$RUNNER_TEMP/xcodegen.zip" | shasum -a 256 --check
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen-tool"
          echo "$RUNNER_TEMP/xcodegen-tool/xcodegen/bin" >> "$GITHUB_PATH"
      - run: scripts/generate-project.sh
      - name: Core, hosted app and UI tests with synthetic data
        run: |
          xcodebuild -version
          xcodebuild -project SpamHole.xcodeproj -scheme SpamHole -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 17e,OS=27.0' \
            -derivedDataPath "$RUNNER_TEMP/SpamHoleDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/SpamHoleTests.xcresult" \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO test
      - name: Archive and validate custom identity without signing credentials
        run: |
          xcodebuild -project SpamHole.xcodeproj -scheme SpamHole -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/SpamHoleDerivedData" \
            -archivePath "$RUNNER_TEMP/SpamHole-unsigned.xcarchive" \
            SPAMHOLE_BUNDLE_IDENTIFIER=org.example.SpamHoleCI \
            SPAMHOLE_APP_GROUP=group.org.example.SpamHoleCI CODE_SIGNING_ALLOWED=NO archive
          python3 -B scripts/validate-release.py --archive "$RUNNER_TEMP/SpamHole-unsigned.xcarchive"
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan public source with pinned Gitleaks
        env:
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" dir . --redact --no-banner
